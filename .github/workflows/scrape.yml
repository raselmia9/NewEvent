name: Scrape Match Server Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: proximity-stage2
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-stage2.txt
          python -m playwright install --with-deps chromium

      - name: Scrape server metadata
        run: python scraper_stage2.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-server-metadata
          path: matches_with_channels.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit output
        run: |
          if [ -f matches_with_channels.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add matches_with_channels.json
            git diff --cached --quiet || git commit -m "Update match server metadata"
            git push
          fi
