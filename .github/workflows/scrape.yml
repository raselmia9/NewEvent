
name: Proximity Match Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: proximity-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Input JSON
        run: |
          if [ ! -f matches.json ]; then
            echo "ERROR: matches.json not found!"
            exit 1
          fi

          python -m json.tool matches.json > /dev/null
          echo "JSON file validated successfully."

      - name: Run Scraper
        run: python scraper.py

      - name: Validate Output JSON
        run: |
          if [ -f matches_with_channels.json ]; then
            python -m json.tool matches_with_channels.json > /dev/null
            echo "Output JSON validated successfully."
          else
            echo "ERROR: Output JSON not found!"
            exit 1
          fi

      - name: Upload JSON Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-scraper-output
          path: |
            matches.json
            matches_with_channels.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit Updated JSON
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f matches.json ]; then
            git add matches.json
          fi

          if [ -f matches_with_channels.json ]; then
            git add matches_with_channels.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update match data"
            git push
          else
            echo "No changes to commit."
          fi
