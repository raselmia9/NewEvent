
name: Proximity Match Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: proximity-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Upload JSON Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-scraper-output
          path: |
            matches.json
            matches_with_channels.json
          if-no-files-found: warnl
          retention-days: 7

      - name: Commit Updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json matches_with_channels.json

          git diff --cached --quiet || git commit -m "Update match data"

          git push
